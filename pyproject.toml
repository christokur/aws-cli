[build-system]
requires = [
    "flit_core>=3.7.1,<3.9.1",
]
build-backend = "pep517"
backend-path = ["backends"]

[project]
name = "awscli"
description = "Universal Command Line Environment for AWS."
version = "2.22.26.post3"
authors = [
  {name = "Amazon Web Services"},
]
license = { file = "LICENSE.txt" }
readme = "README.rst"
requires-python = ">=3.10.13"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    'Programming Language :: Python :: 3 :: Only',
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    'Programming Language :: Python :: 3.12',
]
dependencies = [
    "colorama>=0.2.5,<0.4.7",
    "docutils>=0.10,<0.20",
    "cryptography>=40.0.0,<43.0.2",
    "ruamel.yaml>=0.15.0,<=0.17.21",
    # ruamel.yaml only requires ruamel.yaml.clib for Python versions
    # less than or equal to Python 3.10. In order to ensure we have
    # a consistent dependency closure across all Python versions,
    # we explicitly include ruamel.yaml.clib as a dependency.
    "ruamel.yaml.clib>=0.2.0,<=0.2.8; python_version <= '3.10'",
    "prompt-toolkit>=3.0.24,<3.0.39",
    "distro>=1.5.0,<1.9.0",
    "awscrt==0.23.4",
    "python-dateutil>=2.1,<=2.9.0",
    "jmespath>=0.7.1,<1.1.0",
    "urllib3>=1.25.4,<1.27",
    "setuptools~=71.1.0; python_version >= '3.12'",
    "packaging~=24.1; python_version >= '3.12'",
    # zipp>=3.21.0 dropped support for Python 3.8. In order to ensure
    # we have a consistent dependency closure across all Python
    # versions, we explicitly include zipp as a dependency.
    "zipp<3.21.0",
]
#dynamic = ["version",]

[project.urls]
homepage = "http://aws.amazon.com/cli/"

[tool.awscli.sdist]
include = [
    "backends/**/*.py",
    "bin/*",
    "CHANGELOG.rst",
    "tests/**/*",
    "requirements/**/*.txt",
    "configure",
    "Makefile.in",
    "exe/**/*",
]
# end of cli sdist tool section
# end flit

[tool.black]
line-length = 80
target-version = ['py38', 'py39', 'py310', 'py311']
# 'force-exclude' excludes files or directories in addition to the defaults
force-exclude = '(^/.github/*, ^/.vscode/*, .*\.tf)'
# extend-exclude: keep excluding files from .gitignore in addition to the ones specified
extend-exclude = '''
# A regex preceded with ^/ will apply only to files and directories
# in the root of the project.
(
  ^/\{\{cookiecutter.project_name\}\}/.*
  | .*_pb2.py  # exclude autogenerated Protocol Buffer files anywhere in the project
)
 # end of black_extend_exclude'''
skip-string-normalization = true

[tool.ruff]
builtins = ["_"]
cache-dir = "~/.cache/ruff"
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".idea",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
# In addition to the standard set of exclusions, omit all tests, plus a specific file.
extend-exclude = ["debug"]
# Group violations by containing file.
output-format = "pylint"
# Same as Black.
line-length = 120
# By default, always enumerate fixed violations.
show-fixes = true
# By default, always show source code snippets.
# show-source = false
# Allow imports relative to the "src" and "test" directories.
src = ["", "", ]
target-version = "py38"

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "ANN", "ARG", "B", "BLE", "C", "COM", "D", "DTZ", "E", "EM", "ERA", "EXE", "F", "FBT", "G", "I", "ICN", "INP", "ISC", "N", "PD", "PGH", "PIE", "PL", "PT", "PTH", "Q", "RET", "RUF", "S", "SIM", "T", "TCH", "TID", "TRY", "UP", "W", "YTT"]
ignore = [ "ANN002", "ANN003", "ANN101", "D211","D213", "S101", "T20", "EM101", "EM102", "ERA001", "D417", "BLE001", "RET504", "UP038", "D212", "D407" ]
per-file-ignores = {}
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
# "FBT", "TRY",
select = ["A", "ANN", "ARG", "B", "BLE", "C", "COM", "D", "DTZ", "E", "EM", "ERA", "EXE", "F", "G", "I", "ICN", "INP", "ISC", "N", "PD", "PGH", "PIE", "PL", "PT", "PTH", "Q", "RET", "RUF", "S", "SIM", "T", "TCH", "TID", "UP", "W", "YTT"]
task-tags = ["TODO", "FIXME"]
unfixable = []

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 10

[tool.isort]
profile = "black"
skip_gitignore = true
src_paths = [ "", "",  ]

[tool.flake8]
max-line-length = 120
extend-ignore = "E203"

[tool.pytest.ini_options]
# We set error warning filters in order to enforce that particular
# undesired warnings are not emitted as part of the codebase. If you
# want to override these filters with pytest's default warning filters
# (i.e. print out deprecation warnings instead of erroring out on them),
# you can run pytest with the -Wd flag.
filterwarnings = [
    # Prevents declaring tests that cannot be collected by pytest
    "error::pytest.PytestCollectionWarning",

    # Prevents use of functionality that is deprecated or pending deprecation
    "error::DeprecationWarning",
    "error::PendingDeprecationWarning",

    # Python 3.12 introduced a new DeprecationWarning in python-dateutil's
    # datetime.now() functions and they're scheduled for removal in a future
    # version. When we fully switch over to timezone-aware calls instead,
    # we should be able to remove these filters.
    'default:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning',

    # Python 3.12 introduced a new DeprecationWarning in python-dateutil's
    # datetime.utcfromtimestamp() functions and they're scheduled for removal in
    # a future version. When we fully switch over to timezone-aware calls instead,
    # we should be able to remove these filters.
    'default:datetime\.datetime\.utcfromtimestamp\(\) is deprecated:DeprecationWarning',

    # Python 3.12 introduced a new DeprecationWarning in calls to ast.Str, which
    # flit-core uses. When they release the removal of such calls, we should
    # be able to remove these filters.
    'default:ast\.Str is deprecated and will be removed:DeprecationWarning',

    # Python 3.12 introduced a new DeprecationWarning in flit-core. When they release the
    # removal of reference to 'attribute s', we should be able to remove these filters.
    'default:Attribute s is deprecated and will be removed:DeprecationWarning',

    # Python 3.12 introduced a new DeprecationWarning which gets raised in our call to build_sdist of
    # pep517 backend. When we explicitly address this change, we should be able to remove these filters.
    'default:Python 3\.14 will, by default, filter extracted tar archives and reject files or modify their metadata:DeprecationWarning',

    # Do not error out on deprecation warnings stemming from our current
    # version of setuptools (57.5.0) in a Python 3.10 environment. When we add
    # support for the latest version of setuptools, we should be able to remove
    # these filters.
    'default:The distutils\.sysconfig module is deprecated:DeprecationWarning',

    # Python 3.10.9 introduced a new DeprecationWarning for the implicit
    # creation of event loops. Python plans to remove this warning in the
    # next patch. This filter exception should also be removed once it's
    # confirmed that tests are passing again in the latest Python 3.10.
    # https://github.com/python/cpython/issues/100160
    'default:There is no current event loop:DeprecationWarning',

    # pytest-cov is incompatible with pytest-xdist 3.x because pytest-cov
    # uses the config variable for rsyncdir. This filter exception should
    # be able to be removed once both of the following issues are resolved.
    # https://github.com/pytest-dev/pytest-cov/issues/557
    # https://github.com/pytest-dev/pytest-xdist/issues/825
    'default:The --rsyncdir command line argument and rsyncdirs config variable are deprecated.:DeprecationWarning'
]
markers = [
    "slow: marks tests as slow",
    "validates_models: marks tests as one which validates service models",
]

[tool.poe.tasks.test-cov]
shell = """
[ -z '' ] || {
coverage run -m pytest --doctest-modules  ;
[ 0 -eq $? ] || { echo 'Tests failed'; exit 1; };
coverage combine;
coverage html -d coverage;
coverage report --show-missing ;
}
"""
help = "Check test coverage"

[tool.poe.tasks.export-dev]
shell = """
export PYTHONWARNINGS=ignore::Warning:setuptools.command.install
python3 -m poetry export --without-hashes --with dev -f requirements.txt -o requirements-dev.txt
"""
help = "Export poetry deps to requirements-dev.txt"
interpreter = "bash"

[tool.poe.tasks.export]
shell = """
export PYTHONWARNINGS=ignore::Warning:setuptools.command.install
python3 -m poetry export --without-hashes -f requirements.txt -o requirements.txt
"""
help = "Export poetry deps to requirements.txt"
env = { "PYTHONWARNINGS" = "ignore::Warning:setuptools.command.install" }
interpreter = "bash"

[tool.poe.tasks.cruft-checkout]
shell = "cruft update --force --strict --override --allow-modified-files --checkout ${checkout}"
help = "Run cruft update"
args = [
    { name = "checkout", positional=true, help = "Tag to check out", required = true, multiple = false },
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.15.34post1"
version_files = [
    ".bumpversion.cfg",
    "VERSION",
    "pyproject.toml:version",
]
tag_format = "v$version"
style = [
    ["qmark", "fg:#ff9d00 bold"],
    ["question", "bold"],
    ["answer", "fg:#ff9d00 bold"],
    ["pointer", "fg:#ff9d00 bold"],
    ["highlighted", "fg:#ff9d00 bold"],
    ["selected", "fg:#cc5454"],
    ["separator", "fg:#cc5454"],
    ["instruction", ""],
    ["text", ""],
    ["disabled", "fg:#858585 italic"]
]

[tool.portray]
docs_dir = "docs"
output_dir = ""
modules = ["awscli"]
port = 8000
append_directory_to_python_path = true
include_reference_documentation = true
extra_markdown_extensions = ["admonition", "codehilite", "extra"]

[tool.portray.pdocs]
# TO_DO: [2023-01-25 Christo]: excluded_modules = ["cli.console.vendor",]

[tool.portray.mkdocs]
site_name = "Universal Command Line Environment for AWS."
site_description = "Universal Command Line Environment for AWS."
site_url = "https://aws-cli.docs.infra-area2.com/"
repo_url = "https://github.com/SandsB2B/aws-cli"
edit_uri = "edit/master"
copyright = "(c) 2022 Las Vegas Sands"

extra = { generator = false }
extra_css = ["/docs/css/termynal.css", "/docs/css/custom.css"]
extra_javascript = ["/docs/js/termynal.js", "/docs/js/custom.js"]
strict = true
#hooks = [ "docs/hooks/clusters_hook.py" ] [2023-01-26 Christo] Requires 1.4.x

#[tool.portray.mkdocs.plugins]
#"mkdocs-simple-hooks" = { hooks = { "on_config" = "docs.hooks.clusters:on_config" } }

[tool.portray.mkdocs.theme]
name = "material"
features = [ "search.suggest", "search.highlight", "content.tabs.link" ]
icon = { repo = "fontawesome/brands/github" }
custom_dir = "docs/overrides"

[[tool.portray.mkdocs.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "green"
accent = "brown"
toggle = { icon = "material/lightbulb", name = "Switch to light mode" }

[[tool.portray.mkdocs.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "green"
accent = "yellow"
toggle = { icon = "material/lightbulb-outline", name = "Switch to dark mode" }

[tool.cruft]
skip= ["CODEOWNERS","docs/TODO.md","README.md","Makefile",".gitignore","poetry.toml","tests/__init__.py","tests/conftest.py",".python-version",".gitignore",".github/workflows/build-test-publish.yml",".bumpversion.cfg","pyproject.toml",]
