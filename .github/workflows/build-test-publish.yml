name: Build, Test and Publish

on:
  push:
    branches: [ "*" ]
  #  pull_request:

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_type }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    strategy:
      matrix:
        # Put the version we consider mainline and publish with last
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      AWS_REGION_TOOLS: "us-east-2"
      AWS_ACCOUNT_TOOLS: "747330015130"
      AWS_PROFILE_TOOLS: "cloud-services-prod"
      PYTHON_KEYRING_BACKEND: keyring.backends.null.Keyring
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        id: setup_python
        with:
          python-version: ${{ matrix.python-version }}
          #cache: poetry

      - name: Install poetry
        run: |
          echo python-path:'${{ steps.setup_python.outputs.python-path }}'
          ${{ steps.setup_python.outputs.python-path }} --version
          ${{ steps.setup_python.outputs.python-path }} -m pip install poetry==1.6.1
        shell: bash

      - name: configure-aws-credentials
        uses: DLDInternetLLC/configure-aws-credentials-action@main
        with:
          role_name: "github-codeartifact-readwrite"
          account_id: "747330015130"
          aws_region: "us-east-2"
          aws_profile: "cloud-services-prod"

      - name: Check AWS profiles
        continue-on-error: false
        run: |
          set  +e
          aws configure list-profiles
          aws sts get-caller-identity --profile=$AWS_PROFILE_TOOLS
          
          set | egrep -e '^(AWS_|CI_)'
        shell: bash

      - name: Set up access to CodeArtifact
        run: |
          [ type aws_setup_codeartifact_access 2>/dev/null ] || . $GITHUB_WORKSPACE/cicd/rc/configure_aws_codeartifact.rc
          aws_setup_codeartifact_access
        shell: bash

      - name: Install dependencies and build
        run: |
          pip list
          python scripts/ci/install
          pip list
        shell: bash

      - name: Test coverage
        run: |
          python scripts/ci/run-tests --with-cov || true
          pip uninstall -y awscli
          python scripts/ci/run-backend-tests
        shell: bash

      - name: Publish
        if: matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        run: |
          pip install flit --upgrade
          export FLIT_USERNAME=aws
          export FLIT_PASSWORD=`aws codeartifact get-authorization-token --domain artifacts --domain-owner $AWS_ACCOUNT_TOOLS --query authorizationToken --output text --profile=cloud-services-prod`
          export FLIT_INDEX_URL=`aws codeartifact get-repository-endpoint --domain artifacts --domain-owner $AWS_ACCOUNT_TOOLS --repository pypi --format pypi --query repositoryEndpoint --output text --profile=cloud-services-prod`
          flit publish

#          pip install wheel twine
#          cat ~/.pypirc
#          #export TWINE_USERNAME=aws
#          #export TWINE_PASSWORD=`aws codeartifact get-authorization-token --domain artifacts --domain-owner $AWS_ACCOUNT_TOOLS --query authorizationToken --output text --profile=cloud-services-prod`
#          #export TWINE_REPOSITORY_URL=`aws codeartifact get-repository-endpoint --domain artifacts --domain-owner $AWS_ACCOUNT_TOOLS --repository pypi --format pypi --query repositoryEndpoint --output text --profile=cloud-services-prod`
#          #set | grep TWINE
#          for whl in dist/*.whl; do
#            #twine upload --repository-url $TWINE_REPOSITORY_URL -u $TWINE_USERNAME -p $TWINE_PASSWORD --verbose $whl
#            twine upload --repository codeartifact $whl
